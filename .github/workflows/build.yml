name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (guardada nos segredos do repositorio)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/motorota.jks

      - name: Biblioteca de voz offline (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -sSfL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Compilar
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MotoRota.apk

      - name: Publicar na pagina de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MotoRota v0.1.${{ github.run_number }}
          body: |
            Baixe o arquivo **MotoRota.apk** abaixo e abra no celular Android para instalar.
            (Se o celular pedir, permita "instalar apps de fontes desconhecidas".)
          files: MotoRota.apk
          make_latest: true
