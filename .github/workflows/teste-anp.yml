name: Teste ANP
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q openpyxl
          U2="https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/levantamento-de-precos-de-combustiveis-ultimas-semanas-pesquisadas"
          X=$(curl -sL -A "Mozilla/5.0" "$U2" | grep -o 'https://[^"]*resumo_semanal_lpc[^"]*\.xlsx' | head -1)
          echo "ARQ $X"
          curl -sL -A "Mozilla/5.0" "$X" -o r.xlsx
          python3 - <<'P'
          import openpyxl
          wb = openpyxl.load_workbook("r.xlsx", read_only=True, data_only=True)
          for ws in wb.worksheets:
              print("== ABA", ws.title)
              for i, row in enumerate(ws.iter_rows(values_only=True)):
                  if i > 22: break
                  print([c for c in row if c is not None][:12])
          P
