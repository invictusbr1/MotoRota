name: Teste busca de lugar

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Groq compound (busca na web)
        env:
          K: ${{ secrets.GROQ_KEY }}
        run: |
          for m in groq/compound-mini groq/compound; do
            echo "== $m"
            curl -s https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Encontre o estabelecimento pedido por voz: 'Sabenalto GM Duque de Caxias' (o nome pode ter erro de voz). O piloto esta perto de -22.6435,-43.3379, Brasil. Pesquise na web e responda SOMENTE JSON {\\\"nome\\\":\\\"\\\",\\\"endereco\\\":\\\"rua, numero, bairro, cidade, UF\\\",\\\"lat\\\":0,\\\"lon\\\":0,\\\"achou\\\":true}\"}]}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print((json.dumps(d.get('error'),ensure_ascii=False) if 'error' in d else d['choices'][0]['message']['content'])[:700])"
          done
