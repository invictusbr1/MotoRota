name: Teste busca de lugar

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini + Busca Google
        env:
          K: ${{ secrets.GEMINI_KEY }}
        run: |
          for m in gemini-flash-latest gemini-3.5-flash; do
            echo "== $m"
            curl -s "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -H "x-goog-api-key: $K" -H "Content-Type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"Encontre o lugar pedido por voz: \"Sabenalto GM Duque de Caxias\". O piloto esta perto de -22.6435,-43.3379. Pesquise no Google e responda SOMENTE JSON {\"nome\":\"\",\"endereco\":\"\",\"lat\":0,\"lon\":0,\"achou\":true}"}]}],"tools":[{"google_search":{}}]}' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('error') or [p.get('text') for p in d['candidates'][0]['content']['parts']], ensure_ascii=False)[:800])"
          done
